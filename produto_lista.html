<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listagem de Produtos</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/bootstrap-icons.min.css">
</head>
<body>
    <header class="border-bottom border-primary-subtle bg-body">
        <div class="container">
            <div class="row align-items-center py-3 justify-content-between">
                <div class="col-4">
                    <h1 class="fs-4"><a href="index.html" class="text-decoration-none">ERP One</a></h1>
                    <h2 class="fs-6 lead"> Gerenciamento de Estoque</h2>
                </div>
                <div class="col-8">
                    <nav>
                        <ul class="nav justify-content-end">
                            <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-house-fill"></i> Inicio</a></li>
                            <li class="nav-item"><a class="nav-link" href="produto_lista.html"><i class="bi bi-box-fill"></i> Produtos</a></li>
                            <li class="nav-item"><a class="nav-link" href="atividade_lista.html"><i class="bi bi-arrow-repeat"></i> Movimentações</a></li>
                            <li class="nav-item"><a  class="nav-link" href="extrato_lista.html"><i class="bi bi-receipt"></i> Histórico de Transações</a></li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </header>
    <main class="container">
                    <form class="row  my-3">
                        <div class="col-12 col-md-2 mb-2">
                            <label for=""><strong>ID:</strong></label>
                            <input type="number" min="0" name="idProd" id="idProd" class="form-control">
                            <!--Form control já deixa o input com 100% de largura e estilisado-->
                        </div>
                        <div class="col-12 col-md-2 mb-2">
                            <label for=""><strong>Nome:</strong></label>
                            <input type="text" name="nomeProd" id="nomeProd" class="form-control">
                        </div>
                        <div class="col-12 col-md-2 mb-2">
                            <label for=""><strong>Valor mín:</strong></label>
                            <input type="number" min="0" step="0.01" name="valorMin" id="valorMin" class="form-control">
                        </div>
                        <div class="col-12 col-md-2 mb-2">
                            <label for=""><strong>Valor máx:</strong></label>
                            <input type="number" min="0" step="0.01" name="valorMax" id="valorMax" class="form-control">
                        </div>
                        <div class="col-12 col-md-2 mb-2">
                            <label for=""><strong>Estoque mín:</strong></label>
                            <input type="number" min="0" step="1" name="estoqMin" id="estoqMin" class="form-control">
                        </div>
                        <div class="col-12 col-md-2 mb-2">
                            <label for=""><strong>Estoque máx:</strong></label>
                            <input type="number" min="0" step="1" name="estoqMax" id="estoqMax" class="form-control">
                        </div>
                        <div class="text-center">
                            <button class="btn btn-primary m-3" type="submit"><i class="bi bi-funnel-fill"></i> Filtrar</button>
                        </div>
                    </form>
        <section class="text-center mb-4 border rounded-3 p-4 border-primary-subtle">
            <h3><i class="bi bi-box-fill m-2"></i> Produtos</h3>
            <div class="table-responsive">
                <table class="table table-hover">
                    <!--Table-hover da o efeito de hover na tabela-->
                    <thead class="align-middle table-light"><!--T head -> cabeçalho da tabela, cabeça da tabela-->
                        <!--align middle serve para centralizar verticalmente o conteúdo da célula-->
                        <tr><!--Linha da tabela-->
                            <th>ID</th><!--Célula do cabeçlho-->
                            <th>Nome</th>
                            <th>Preço</th>
                            <th>Estoque</th>
                            <th>Cadastrado por</th>
                            <th>Data de Cadastro</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>21</td>
                            <td>Coca Cola KS</td>
                            <td>11 Reais</td>
                            <td>20 unid.</td>
                            <td>Roberto</td>
                            <td>20/07/2026</td>
                        </tr>
                    </tbody>
                </table>
                <p><a class="btn btn-lg btn-primary m-3" href="produto_cadastra.html"><i class="bi bi-plus-circle"></i> Cadastrar novo Produto</a></p>
            </div>
        </section>
    </main>
</body>
</html>
