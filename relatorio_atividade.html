<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geração de Relatório</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/bootstrap-icons.min.css">
</head>
<body>
    <header class="border-bottom border-primary-subtle bg-body">
        <div class="container">
            <div class="row align-items-center py-3 justify-content-between">
                <div class="col-4">
                    <h1 class="fs-4"><a href="index.html" class="text-decoration-none">ERP One</a></h1>
                    <h2 class="fs-6 lead"> Gerenciamento de Estoque</h2>
                </div>
                <div class="col-8">
                    <nav>
                        <ul class="nav justify-content-end">
                            <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-house-fill"></i> Inicio</a></li>
                            <li class="nav-item"><a class="nav-link" href="produto_lista.html"><i class="bi bi-box-fill"></i> Produtos</a></li>
                            <li class="nav-item"><a class="nav-link" href="atividade_lista.html"><i class="bi bi-arrow-repeat"></i> Movimentações</a></li>
                            <li class="nav-item"><a  class="nav-link" href="extrato_lista.html"><i class="bi bi-receipt"></i> Histórico de Transações</a></li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </header>
    <main class="container my-3">
        <div class="row">
            <div class="col-12 col-xl-8">
                <div class="bg-primary-subtle rounded p-2">
                    <h3 class="fw-bold mb-1">Gerar relatório de atividade</h3>
                    <p class="mt-2 mb-0">Gere um relatório das atividades contendo: Nome do produto, Tipo de atividade, Valor Envolvido, Unidades envolvidas, Data de realização e quem realisou!</p>
                </div>
            </div>
        </div>
        <section class="text-center mb-4 border rounded-3 p-4 border-primary-subtle my-4">
            <form class="row  my-2">
                <div class="col-12 col-md-4 mb-2">
                    <label for=""><strong>Valor mín:</strong></label>
                    <input type="number" min="0" step="0.01" name="valorMin" id="valorMin" class="form-control">
                </div>
                <div class="col-12 col-md-4 mb-2">
                    <label for=""><strong>Valor máx:</strong></label>
                    <input type="number" min="0" step="0.01" name="valorMax" id="valorMax" class="form-control">
                </div>
                <div class="col-12 col-md-4 mb-2">
                    <label for=""><strong>Estoque mín:</strong></label>
                    <input type="number" min="0" step="1" name="estoqMin" id="estoqMin" class="form-control">
                </div>
                <div class="col-12 col-md-4 mb-2">
                    <label for=""><strong>Estoque máx:</strong></label>
                    <input type="number" min="0" step="1" name="estoqMax" id="estoqMax" class="form-control">
                </div>
                <div class="col-12 col-md-4 mb-2">
                    <label for=""><strong>Realizada de:</strong></label>
                    <input type="date" name="dataInicial" id="dataInicial" class="form-control">
                    <!--Form control já deixa o input com 100% de largura e estilisado-->
                </div>
                <div class="col-12 col-md-4 mb-2">
                    <label for=""><strong>Até:</strong></label>
                    <input type="date" name="dataUltima" id="dataUltima" class="form-control">
                </div>
                <div class="col-12 col-md-4 mb-2">
                    <label for=""><strong>Quem realizou:</strong></label>
                    <input type="text" name="quemFez" id="quemFez" class="form-control">
                </div>
                <div class="col-12 col-md-4 mb-2">
                    <label for=""><strong>Tipo:</strong></label>
                    <select id="select" class="form-control">
                        <option value=""></option>
                        <option value="COMPRA" id="COMPRA">Compra</option>
                        <option value="VENDA" id="VENDA">Venda</option>
                        <option value="TRANSFERÊNCIA" id="TRANSFERÊNCIA">Tranferência</option>
                        <option value="DEVOLUÇÃO" id="DEVOLUÇÃO">Devolução</option>
                        <option value="PERCA" id="PERCA">Perca</option>
                    </select>
                </div>
                <div class="text-center col-12 col-md-4">
                    <button class="btn btn-primary mt-4" type="submit"><i class="bi bi-download"></i> Baixar Relatório</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
