<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listagem de Movimentações</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/bootstrap-icons.min.css">
</head>
</head>
<body>
    <header class="border-bottom border-primary-subtle bg-body">
        <!--border bottom cria apenas a linha debaixo da borda-->
        <div class="container">
            <div class="row align-items-center py-3 justify-content-between">
                <!--Uma das colunas fica extremamente a direita e a outra extremamente a esquerda-->
                <div class="col-4">
                    <h1 class="fs-4"><a href="index.html" class="text-decoration-none">ERP One</a></h1>
                    <h2 class="fs-6 lead"> Gerenciamento de Estoque</h2>
                </div>
                <div class="col-8">
                    <nav>
                        <ul class="nav justify-content-end">
                        <!--nav deixa os itens de lista alinhados na horizontal-->
                            <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-house-fill"></i> Inicio</a></li>
                            <li class="nav-item"><a class="nav-link" href="produto_lista.html"><i class="bi bi-box-fill"></i> Produtos</a></li>
                            <li class="nav-item"><a class="nav-link" href="atividade_lista.html"><i class="bi bi-arrow-repeat"></i> Movimentações</a></li>
                            <li class="nav-item"><a  class="nav-link" href="extrato_lista.html"><i class="bi bi-receipt"></i> Histórico de Transações</a></li>
                            <!--Classe nav-item depende da classe nav no ul-->
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </header>
    <main class="container">
        <div class="row">
                <div class="col-12 my-2">
                    <form class="row  my-3">
                        <div class="col-12 col-md-2 mb-2">
                            <label for=""><strong>ID:</strong></label>
                            <input type="number" min="0" step="1" name="idProd" id="idProd" class="form-control">
                        </div>
                        <div class="col-12 col-md-2 mb-2">
                            <label for=""><strong>Nome:</strong></label>
                            <input type="text" name="nomeProd" id="nomeProd" class="form-control">
                        </div>
                        <div class="col-12 col-md-2 mb-2">
                            <label for=""><strong>Unidades mínimas:</strong></label>
                            <input type="number" min="0" step="1" name="unidMin" id="unidMin" class="form-control">
                        </div>
                        <div class="col-12 col-md-2 mb-2">
                            <label for=""><strong>Unidades máximas:</strong></label>
                            <input type="number" min="0" step="1" name="unidMax" id="unidMax" class="form-control">
                        </div>
                        <div class="col-12 col-md-2 mb-2">
                            <label for=""><strong>Valor minímo</strong></label>
                            <input type="number" min="0" step="0.01" name="valorMin" id="valorMin" class="form-control">
                        </div>
                        <div class="col-12 col-md-2 mb-2">
                            <label for=""><strong>Valor máximo:</strong></label>
                            <input type="number" min="0" step="0.1" name="valorMax" id="valorMax" class="form-control">
                        </div>
                        <div class="col-12 col-md-2 mb-2">
                            <label for=""><strong>Operação:</strong></label>
                            <select id="select" class="form-control">
                                <option value=""></option>
                                <option value="COMPRA" id="COMPRA">Compra</option>
                                <option value="VENDA" id="VENDA">Venda</option>
                                <option value="TRANSFERÊNCIA" id="TRANSFERÊNCIA">Tranferência</option>
                                <option value="DEVOLUÇÃO" id="DEVOLUÇÃO">Devolução</option>
                                <option value="PERCA" id="PERCA">Perca</option>
                            </select>
                        </div>
                        <div class="col-12 col-md-2 mb-2">
                            <label for=""><strong>Quem realizou:</strong></label>
                            <input type="text" name="quemFez" id="quemFez" class="form-control">
                        </div>
                        <div class="col-12 col-md-2 mb-2">
                            <label for=""><strong>Feita de:</strong></label>
                            <input type="date" name="dataInicial" id="dataInicial" class="form-control">
                        </div>
                        <div class="col-12 col-md-2 mb-2">
                            <label for=""><strong>Até:</strong></label>
                            <input type="date" name="dataUltima" id="dataUltima" class="form-control">
                        </div>
                        <div class="text-center col-12 col-md-4 mb-2 mt-2">
                            <button class="btn btn-primary m-3 w-100" type="submit"><i class="bi bi-funnel-fill"></i> Filtrar</button>
                        </div>
                    </form>
                </div>
            </div>
        <section class="text-center mb-4 border rounded-3 p-4 border-primary-subtle">
            <h3><i class="bi bi-arrow-repeat"></i> Atividades</h3>
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead class="align_middle table-light">
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Tipo</th>
                            <th>Unidades envolvidass</th>
                            <th>Data de realização</th>
                            <th>Realizada por:</th>
                            <th>Valor envolvido</th>
                        </tr>
                        <tbody>
                            <td>1</td>
                            <td>Detergente</td>
                            <td>CADASTRO</td>
                            <td>15</td>
                            <td>05/07/2026</td>
                            <td>Roberto</td>
                            <td>R$80,00</td>
                        </tbody>
                    </thead>
                </table>
                <div>
                    <p><a class="btn btn-lg btn-primary m-3" href="atividade_cadastra.html"><i class="bi bi-plus-circle"></i> Registrar Alteração</a></p>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
