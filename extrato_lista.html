<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de Extrações</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/bootstrap-icons.min.css">
</head>
<body>
    <header class="border-bottom border-primary-subtle bg-body">
        <!--border bottom cria apenas a linha debaixo da borda-->
        <div class="container">
            <div class="row align-items-center py-3 justify-content-between">
                <!--Uma das colunas fica extremamente a direita e a outra extremamente a esquerda-->
                <div class="col-4">
                    <h1 class="fs-4"><a href="index.html" class="text-decoration-none">ERP One</a></h1>
                    <h2 class="fs-6 lead"> Gerenciamento de Estoque</h2>
                </div>
                <div class="col-8">
                    <nav>
                        <ul class="nav justify-content-end">
                        <!--nav deixa os itens de lista alinhados na horizontal-->
                            <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-house-fill"></i> Inicio</a></li>
                            <li class="nav-item"><a class="nav-link" href="produto_lista.html"><i class="bi bi-box-fill"></i> Produtos</a></li>
                            <li class="nav-item"><a class="nav-link" href="atividade_lista.html"><i class="bi bi-arrow-repeat"></i> Movimentações</a></li>
                            <li class="nav-item"><a  class="nav-link" href="extrato_lista.html"><i class="bi bi-receipt"></i> Histórico de Transações</a></li>
                            <!--Classe nav-item depende da classe nav no ul-->
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </header>
    <main class="container">
            <div class="row">
            <!--Justify-content e align-items só atua no layout dos filhos diretos
            já o text-align atua nos seus decendentes também-->
            <!--Justify content/align-itens como vou distribuir meus filhos?-->
            <!--text-align como o conteúdo de texto dentro de mim deve ser alinhado?-->
                <div class="col-12 my-2">
                    <form class="row  my-3">
                        <!--Row está sendo usado aqui porque dentro deste formukário estamos usando col- -->
                        <!--como justify-content e align-item só dao seus atributos a filhos diretos, row também
                        por isso precisamos usar row aqui mesmo tendo usado na div "avo"-->
                        <div class="col-12 col-md-2 mb-2">
                            <label for=""><strong>Tipo:</strong></label>
                            <select id="select" class="form-control">
                                <option value=""></option>
                                <option value="ENTRADA" id="SAÍDA">Entrada</option>
                                <option value="Saída" id="Saída">Saída</option>
                            </select>
                            <!--Form control já deixa o input com 100% de largura e estilisado-->
                        </div>
                        <div class="col-12 col-md-2 mb-2">
                            <label for=""><strong>Quem realizou:</strong></label>
                            <input type="text" name="nomeProd" id="nomeProd" class="form-control">
                        </div>
                        <div class="col-12 col-md-2 mb-2">
                            <label for=""><strong>Valor mín:</strong></label>
                            <input type="number" min="0" step="0.01" name="valorMin" id="valorMin" class="form-control">
                        </div>
                        <div class="col-12 col-md-2 mb-2">
                            <label for=""><strong>Valor máx:</strong></label>
                            <input type="number" min="0" step="0.01" name="valorMax" id="valorMax" class="form-control">
                        </div>
                        <div class="col-12 col-md-2 mb-2">
                            <label for=""><strong>Realizada de:</strong></label>
                            <input type="date" name="dataInicial" id="dataInicial" class="form-control">
                        </div>
                        <div class="col-12 col-md-2 mb-2">
                            <label for=""><strong>Até:</strong></label>
                            <input type="date" name="dataUltima" id="dataUltima" class="form-control">
                        </div>
                        <div class="text-center">
                            <button class="btn btn-primary m-3" type="submit"><i class="bi bi-funnel-fill"></i> Filtrar</button>
                        </div>
                    </form>
                </div>
            </div>
        <section class="text-center mb-4 border rounded-3 p-4 border-primary-subtle"><!--Sem padding a caixa vira uma linha porque não tem acolchamento por dentro-->
            <h3><i class="bi bi-box-fill m-2"></i> Histórico de Transações</h3>
            <div class="table-responsive">
                <table class="table table-hover">
                    <!--Table-hover formata a tabela-->
                    <thead class="align-middle table-light"><!--T head -> cabeçalho da tabela, cabeça da tabela-->
                        <tr><!--Linha da tabela-->
                            <th>Tipo</th><!--Célula do cabeçlho-->
                            <th>Quem realizou</th>
                            <th>Valor</th>
                            <th>Data</th>
                            <th>Horário</th>
                        </tr>
                    </thead>
                    <tbody>
                        <td>Saída</td>
                        <td>Pedro</td>
                        <td>- R$ 1200,00</td>
                        <td>05/07/2026</td>
                        <td>16:34</td>
                    </tbody>
                </table>
        </section>
    </main>
</body>
</html>
