<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Alteração</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/bootstrap-icons.min.css">
</head>
<body>
    <header class="border-bottom border-primary-subtle bg-body">
        <!--border bottom cria apenas a linha debaixo da borda-->
        <div class="container">
            <div class="row align-items-center py-3 justify-content-between">
                <!--Uma das colunas fica extremamente a direita e a outra extremamente a esquerda-->
                <div class="col-4">
                    <h1 class="fs-4"><a href="index.html" class="text-decoration-none">ERP One</a></h1>
                    <h2 class="fs-6 lead"> Gerenciamento de Estoque</h2>
                </div>
                <div class="col-8">
                    <nav>
                        <ul class="nav justify-content-end">
                        <!--nav deixa os itens de lista alinhados na horizontal-->
                            <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-house-fill"></i> Inicio</a></li>
                            <li class="nav-item"><a class="nav-link" href="produto_lista.html"><i class="bi bi-box-fill"></i> Produtos</a></li>
                            <li class="nav-item"><a class="nav-link" href="atividade_lista.html"><i class="bi bi-arrow-repeat"></i> Movimentações</a></li>
                            <li class="nav-item"><a  class="nav-link" href="extrato_lista.html"><i class="bi bi-receipt"></i> Histórico de Transações</a></li>
                            <!--Classe nav-item depende da classe nav no ul-->
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </header>
    <main class="container my-3">
        <div class="row">
            <div class="col-12 col-xl-8">
                <div class="bg-primary-subtle rounded p-2">
                    <h3 class="fw-bold mb-1">Registro de alterações</h3>
                    <p class="mt-2 mb-0">Preencha o formulario abaixo para registrar alterações</p>
                </div>
            </div>
            <div class="my-3 border rounded-3 pt-3 pb-5 ">
                <div class="border-bottom ps-3 pb-2">
                    <strong>Dados da alteração:</strong>
                </div>
                <div class="row">
                    <div class="col-12 my-3">
                        <form class="row my-3 m-4">
                            <div class="col-12 col-md-6 my-2" id="nome">
                                <label class="mb-1" for=""><strong>Nome do Produto:</strong></label>
                                <input type="text" class="form-control" id="nomeProd">
                            </div>
                            <div class="col-12 col-md-6 my-2" id="id">
                                <label class="mb-1" for=""><strong>ID do Produto:</strong></label>
                                <input type="number" min="0" step="1" name="idProd" id="idProd" class="form-control">
                            </div>
                            <div class="col-12 col-md-6 my-2" id="tipo">  
                                <label class="mb-1" for=""><strong>Tipo:</strong></label>
                                <select name="" id="sel" class="form-control">
                                    <option value=""></option>
                                    <option value="COMPRA" id="COMPRA">Compra</option>
                                    <option value="VENDA" id="VENDA">Venda</option>
                                    <option value="TRANSFERÊNCIA" id="TRANSFERÊNCIA">Tranferência</option>
                                    <option value="DEVOLUÇÃO" id="DEVOLUÇÃO">Devolução</option>
                                    <option value="PERCA" id="PERCA">Perca</option>
                                    

                                </select>
                            </div>
                            <div class="col-12 col-md-6 my-2" id="valor">
                                <label class="mb-1" for=""><strong>Valor Envolvido:</strong></label>
                                <input type="number" min="0" step="0.01" name="valorEnvolvido" id="valorEnvolvido" class="form-control">
                            </div>
                            <div class="col-12 col-md-6 my-2" id="unidades">
                                <label class="mb-1" for=""><strong>Unidades envolvidas:</strong></label>
                                <input type="number" min="0" step="1" name="unid" id="unid" class="form-control">
                            </div>
                            <div class="col-12 col-md-6 my-4">
                                <button class="btn btn-primary btn-lg w-100" type="submit" onclick="verificar()"><i class="bi bi-plus-circle"></i> Registrar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script>
        function verificar(){
            event.preventDefault() // não deixa o comportamento padrão começar(no caso de formulário recarregar a página)
            var prod = document.getElementById("nomeProd").value
            var divProd = document.getElementById("nome")


            var id = document.getElementById('idProd').value
            var divId = document.getElementById('id')
            
            var tipo = document.getElementById('sel').value
            var divTipo = document.getElementById('tipo')

            var valor = document.getElementById('valorEnvolvido').value
            var divValor = document.getElementById('valor')

            var unid = document.getElementById("unid").value
            var divUnid = document.getElementById('unidades')

            var campo = [prod, id, tipo, valor, unid]
            var div = [divProd, divId, divTipo, divValor, divUnid]
            for(var pos=0; pos<campo.length; pos++){
                if (campo[pos]==''){
                    var p = document.createElement('p') 
                    p.textContent = "*Campo obrigatório"
                    p.style.color = 'red'
                    div[pos].appendChild(p)
                }
            }
        }
    </script>
</body>
</html>
